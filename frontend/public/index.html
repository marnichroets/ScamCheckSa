<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a3c6e" />
    <meta name="description" content="ScamCheckSA — South Africa's #1 scam reporting and verification database. Search, report and expose scammers." />
    <title>ScamCheckSA — SA's Scam Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" type="image/png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: #080B10;
        color: #E2E8F0;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #080B10; }
      ::-webkit-scrollbar-thumb { background: #1C2636; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #1a3c6e; }
      input, select, textarea, button { font-family: inherit; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
